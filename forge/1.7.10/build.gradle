buildscript {
 repositories { maven { url='https://maven.minecraftforge.net/' }; maven { url='https://repo.maven.apache.org/maven2/' } }
 dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:1.2-20211118.175523-305' }
}
apply plugin: 'forge'
group='dev.eyecrasher.jukeboxplaylists'
version='1.1.0'
archivesBaseName='jukebox-playlists-forge-1.7.10'
sourceCompatibility=targetCompatibility='1.8'
minecraft { version='1.7.10-10.13.4.1614-1.7.10'; runDir='run' }
getVersionJson.url = 'https://piston-meta.mojang.com/v1/packages/ed5d8789ed29872ea2ef1c348302b0c55e3f3468/1.7.10.json'
getAssetsIndex.url = 'https://launchermeta.mojang.com/v1/packages/1863782e33ce7b584fc45b037325a1964e095d3e/1.7.10.json'
downloadClient.url = new net.minecraftforge.gradle.delayed.DelayedString(project, 'https://launcher.mojang.com/v1/objects/e80d9b3bf5085002218d4be59e668bac718abbc6/client.jar')
downloadServer.url = new net.minecraftforge.gradle.delayed.DelayedString(project, 'https://launcher.mojang.com/v1/objects/952438ac4e01b4d115c5fc38f891710c4941df29/server.jar')

tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }
processResources {
    inputs.property 'version', project.version
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand version: project.version
    }
    from(sourceSets.main.resources.srcDirs) { exclude 'mcmod.info' }
}
jar {
    manifest {
        attributes FMLCorePlugin: 'dev.eyecrasher.jukeboxplaylists.JukeboxRemovalHook', FMLCorePluginContainsFMLMod: 'true'
    }
    from('LICENSE') { rename { 'LICENSE_jukebox-playlists.txt' } }
}
