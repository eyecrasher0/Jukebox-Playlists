buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:3.0.197' }
}
apply plugin: 'net.minecraftforge.gradle'

group = 'dev.eyecrasher.jukeboxplaylists'
version = '1.1.0'
archivesBaseName = 'jukebox-playlists-forge-1.12.2'
sourceCompatibility = targetCompatibility = '1.8'

minecraft { mappings channel: 'snapshot', version: '20171003-1.12' }
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2864' }

tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }
processResources {
    inputs.property 'version', project.version
    filesMatching('mcmod.info') { expand version: project.version }
}
jar {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from('LICENSE') { rename { 'LICENSE_jukebox-playlists.txt' } }
}
jar.finalizedBy('reobfJar')
