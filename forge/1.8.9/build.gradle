buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-20211118.174922-42' }
}
apply plugin: 'net.minecraftforge.gradle.forge'

group = 'dev.eyecrasher.jukeboxplaylists'
version = '1.1.0'
archivesBaseName = 'jukebox-playlists-forge-1.8.9'
sourceCompatibility = targetCompatibility = '1.8'
minecraft {
    version = '1.8.9-11.15.1.2318-1.8.9'
    mappings = 'stable_20'
    runDir = 'run'
}
repositories { mavenCentral() }
tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }
processResources {
    inputs.property 'version', project.version
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand version: project.version
    }
    from(sourceSets.main.resources.srcDirs) { exclude 'mcmod.info' }
}
jar {
    from('LICENSE') { rename { 'LICENSE_jukebox-playlists.txt' } }
}
