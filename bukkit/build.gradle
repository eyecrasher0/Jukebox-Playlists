plugins { id 'java' }

group = 'dev.eyecrasher.jukeboxplaylists'
version = '1.1.0'

repositories {
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    mavenCentral()
}

dependencies {
    compileOnly('org.spigotmc:spigot-api:1.12.2-R0.1-SNAPSHOT') { transitive = false }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 8
}

processResources {
    inputs.property 'version', project.version
    filesMatching('plugin.yml') { expand version: project.version }
}

jar {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from('LICENSE') { rename { 'LICENSE_jukebox-playlists.txt' } }
}
